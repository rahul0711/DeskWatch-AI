[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cctv-face-detection"
version = "0.1.0"
description = "CCTV face detection + attendance: RTSP capture, YOLO detection/tracking, FastAPI/React web dashboard"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9,<5",
    "torch>=2.2",
    "ultralytics>=8.3",
    "numpy>=1.26,<3",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "facenet-pytorch>=2.5.0",
    "torchvision>=0.17.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0",
]

[project.optional-dependencies]
# Only needed by scripts/discover_camera.py -- the app itself degrades
# gracefully without these.
discovery = ["onvif-zeep>=0.2.12", "WSDiscovery>=2.0.0"]
dev = ["pytest>=8.0", "psutil>=5.9"]

[project.scripts]
# Desktop entry point (main.py's cv2 window app). The web app has no
# script entry point of its own -- it's run via
# `uvicorn app.web.server:app`, same as any other ASGI app.
cctv-desktop = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
